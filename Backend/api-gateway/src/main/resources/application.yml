server:
  port: 8888

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8080
          predicates:
            - Path=/auth/**

        - id: restaurant-service
          uri: http://localhost:8081
          predicates:
            - Path=/restaurants/**

        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/orders/**

        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/payments/**