server:
  port: 8888

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8080
              predicates:
                - Path=/auth,/auth/**

            - id: restaurant-service
              uri: http://localhost:8081
              predicates:
                - Path=/restaurants,/restaurants/**

            - id: order-service
              uri: http://localhost:8082
              predicates:
                - Path=/orders,/orders/**

            - id: payment-service
              uri: http://localhost:8083
              predicates:
                - Path=/payments,/payments/**