services:
  auth-service:
    build: ./auth-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://<your-auth-neon-host>/neondb?sslmode=require&channel_binding=require
      SPRING_DATASOURCE_USERNAME: <your-auth-username>
      SPRING_DATASOURCE_PASSWORD: <your-auth-password>

  restaurant-service:
    build: ./restaurant-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://<your-restaurant-neon-host>/neondb?sslmode=require&channel_binding=require
      SPRING_DATASOURCE_USERNAME: <your-restaurant-username>
      SPRING_DATASOURCE_PASSWORD: <your-restaurant-password>

  order-service:
    build: ./order-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://<your-order-neon-host>/neondb?sslmode=require&channel_binding=require
      SPRING_DATASOURCE_USERNAME: <your-order-username>
      SPRING_DATASOURCE_PASSWORD: <your-order-password>

  payment-service:
    build: ./payment-service
    ports:
      - "8083:8083"
    environment:
      RAZORPAY_KEY_ID: <your-razorpay-test-key-id>
      RAZORPAY_KEY_SECRET: <your-razorpay-test-secret>

  api-gateway:
    build: ./api-gateway
    ports:
      - "8888:8888"
    depends_on:
      - auth-service
      - restaurant-service
      - order-service
      - payment-service